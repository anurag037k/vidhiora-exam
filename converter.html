<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vidhiora Question Converter</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #1e293b; color: white; padding: 10px; margin-bottom: 10px; }
        button { background: #fbbf24; color: black; padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <h2>1. Paste Raw Text Here</h2>
    <textarea id="rawInput" placeholder="Paste your Q1 to Q100 text here..."></textarea>
    
    <h2>2. Paste Answer Key (e.g., 1 D, 2 C...)</h2>
    <textarea id="keyInput" placeholder="1 D&#10;2 C&#10;3 D..."></textarea>
    
    <button onclick="convertToJSON()">Convert to JSON</button>

    <h2>3. Copy JSON Output (For Admin Dashboard)</h2>
    <textarea id="jsonOutput" readonly></textarea>

    <script>
        function convertToJSON() {
            const rawText = document.getElementById('rawInput').value;
            const keyText = document.getElementById('keyInput').value;
            
            // Parse Answer Key
            const ansMap = {};
            const keyMatches = [...keyText.matchAll(/(\d+)\s+([A-D])/g)];
            keyMatches.forEach(m => {
                const qNum = parseInt(m[1]);
                const char = m[2];
                // Convert A,B,C,D to 0,1,2,3
                ansMap[qNum] = char === 'A' ? 0 : char === 'B' ? 1 : char === 'C' ? 2 : 3;
            });

            // Parse Questions
            const questions = [];
            const qBlocks = rawText.split(/Q\d+\./).slice(1); // Split by Q1., Q2., etc.
            
            qBlocks.forEach((block, index) => {
                const qNum = index + 1;
                
                // Extract options A., B., C., D.
                const optMatch = block.match(/A\.\s*(.*?)\s*B\.\s*(.*?)\s*C\.\s*(.*?)\s*D\.\s*(.*)/s);
                if (!optMatch) return;
                
                const questionText = block.substring(0, block.indexOf('A.')).trim();
                const opts = [optMatch[1].trim(), optMatch[2].trim(), optMatch[3].trim(), optMatch[4].trim()];
                
                questions.push({
                    q: questionText,
                    opts: opts,
                    ans: ansMap[qNum] !== undefined ? ansMap[qNum] : 0, // Fallback to 0 if key missing
                    cat: "Constitutional Law" // Default category
                });
            });

            document.getElementById('jsonOutput').value = JSON.stringify(questions, null, 2);
            alert(`Successfully converted ${questions.length} questions!`);
        }
    </script>
</body>
</html>
